version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: polyflip_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-polyflip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-polyflip}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - polyflip_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: .
    container_name: polyflip_api
    restart: always
    depends_on:
      - db
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - POLYFLIP_BUILD_SHA=${POLYFLIP_BUILD_SHA:-dev}
      - API_KEY=${API_KEY:-test-key}
      - ASSETS=${ASSETS:-BTC,ETH,SOL,XRP,DOGE}
      - EXECUTION_MODE=${EXECUTION_MODE:-PAPER}
      - AI_LAB_MODE=${AI_LAB_MODE:-STANDARD}
      - AI_LAB_THREAD_PROVIDER=${AI_LAB_THREAD_PROVIDER:-none}
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
    command: uvicorn polyflip.api.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M


  lgbm_training_worker:
    build: .
    container_name: polyflip_lgbm_training_worker
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - POLYFLIP_BUILD_SHA=${POLYFLIP_BUILD_SHA:-dev}
      - API_KEY=${API_KEY:-test-key}
      - ASSETS=${ASSETS:-BTC,ETH,SOL,XRP,DOGE}
      - LGBM_TRAINING_POLL_INTERVAL_SEC=${LGBM_TRAINING_POLL_INTERVAL_SEC:-2}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./backups:/app/backups
    command: python -m polyflip.crypto.training_worker
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  ai_lab_agent:
    build: .
    container_name: polyflip_ai_lab_agent
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - POLYFLIP_BUILD_SHA=${POLYFLIP_BUILD_SHA:-dev}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_LAB_LLM_PROVIDER=${AI_LAB_LLM_PROVIDER:-mock}
      - AI_LAB_MODEL_RESEARCH=${AI_LAB_MODEL_RESEARCH:-gpt-5.6}
      - AI_LAB_MODEL_SUMMARY=${AI_LAB_MODEL_SUMMARY:-gpt-5.6-mini}
      - AI_LAB_LLM_STORE=false
      - AI_LAB_MODE=${AI_LAB_MODE:-STANDARD}
      - AI_LAB_THREAD_PROVIDER=${AI_LAB_THREAD_PROVIDER:-none}
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: python -m polyflip.ai_lab.agent_runner
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

  scheduler:
    build: .
    container_name: polyflip_scheduler
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - POLYFLIP_BUILD_SHA=${POLYFLIP_BUILD_SHA:-dev}
      - API_KEY=${API_KEY:-test-key}
      - ASSETS=${ASSETS:-BTC,ETH,SOL,XRP,DOGE}
      - EXECUTION_MODE=${EXECUTION_MODE:-PAPER}
      - AI_LAB_MODE=${AI_LAB_MODE:-STANDARD}
      - AI_LAB_SCHEDULE_ENABLED=${AI_LAB_SCHEDULE_ENABLED:-false}
      - AI_LAB_RESEARCH_INTERVAL_SECONDS=${AI_LAB_RESEARCH_INTERVAL_SECONDS:-0}
      - AI_LAB_RESEARCH_MAX_ITERATIONS=${AI_LAB_RESEARCH_MAX_ITERATIONS:-1}
      - AI_LAB_MAX_DAILY_RUNS=${AI_LAB_MAX_DAILY_RUNS:-1}
      - AI_LAB_MAX_CONCURRENT_RUNS=${AI_LAB_MAX_CONCURRENT_RUNS:-1}
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./backups:/app/backups
    command: python -m polyflip.scheduler.jobs
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/scheduler_alive && find /tmp/scheduler_alive -mmin -1 | grep -q scheduler_alive
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  execution_worker_paper:
    build: .
    container_name: polyflip_execution_worker_paper
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - POLYFLIP_BUILD_SHA=${POLYFLIP_BUILD_SHA:-dev}
      - EXECUTION_MODE=PAPER
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
    command: python -m polyflip.execution.worker
    deploy:
      resources:
        limits:
          memory: 512M

  live_mirror_worker:
    build: .
    container_name: flipoly-live_mirror_worker-1
    restart: unless-stopped
    profiles: ["live-v2"]
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - MIRROR_TARGET_MODE=LIVE
      - MIRROR_POLL_INTERVAL=10
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
    command: python -m polyflip.execution.live_mirror_worker
    deploy:
      resources:
        limits:
          memory: 256M

  release_gate_worker:
    build: .
    container_name: flipoly-release_gate_worker-1
    restart: unless-stopped
    profiles: ["live-v2"]
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
    command: python -m polyflip.execution.release_gate --mode=LIVE
    deploy:
      resources:
        limits:
          memory: 256M

  execution_worker_live:
    build: .
    container_name: flipoly-execution_worker_live-1
    restart: unless-stopped
    profiles: ["live-v2"]
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - EXECUTION_MODE=LIVE
      - POLYGON_PRIVATE_KEY=${POLYGON_PRIVATE_KEY:-}
      - POLYGON_ADDRESS=${POLYGON_ADDRESS:-}
      - POLYMARKET_RELAYER_API_KEY=${POLYMARKET_RELAYER_API_KEY:-}
      - POLYMARKET_RELAYER_API_KEY_ADDRESS=${POLYMARKET_RELAYER_API_KEY_ADDRESS:-}
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
    command: python -m polyflip.execution.worker
    deploy:
      resources:
        limits:
          memory: 512M

  execution_worker_shadow:
    build: .
    container_name: polyflip_execution_worker_shadow
    restart: always
    depends_on:
      - db
    profiles: ["shadow"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-polyflip}:${DB_PASSWORD:-secret}@db/${DB_NAME:-polyflip}}
      - POLYFLIP_BUILD_SHA=${POLYFLIP_BUILD_SHA:-dev}
      - EXECUTION_MODE=SHADOW
    volumes:
      - ./polyflip:/app/polyflip
      - ./scripts:/app/scripts
    command: python -m polyflip.execution.worker
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  polyflip_db_data:
