policy_P0:
  p_flip: outsider_mid  # рыночная цена стороны аутсайдера, НЕ прогноз модели
  edge: p_flip - exec_cost(candidate_ask)
  rule: BUY if edge > min_edge else SKIP
  min_edge: 0.03
  min_edge_status: development_fixed  # зафиксирован до обучения LGBM и до вскрытия final
  exec_cost: ask + 0.07*ask*(1-ask) + 0.005*ask
  settle: win -> 1/exec_cost - 1; loss -> -1; skip -> 0
  budget: $1
  fitted_parameters: none  # чистый бенчмарк, обучения нет

