[tool.poetry]
name = "polyflip"
version = "0.1.0"
description = "Polymarket 15m markets analytic and prediction service"
authors = ["Roman Orlov <dr.orlov@yandex.ru>"]
readme = "README.md"
packages = [{include = "polyflip"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlalchemy = "^2.0.31"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic-settings = "^2.3.4"
structlog = "^24.2.0"
scikit-learn = "^1.5.0"
apscheduler = "^3.10.4"
jinja2 = "^3.1.4"
httpx = "^0.27.0"
polymarket-client = "==0.2.0"
pandas = "^2.2.0"
numpy = ">=1.26,<3"
lightgbm = ">=4.3,<5"
sentry-sdk = {extras = ["fastapi"], version = "^2.8.0"}
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"
aiosqlite = "^0.20.0"
pytest-cov = "^5.0.0"
respx = "^0.21.1"
black = "^24.0"
flake8 = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "live: tests that can access a live external trading venue",
    "postgres: tests that require the PostgreSQL integration service",
]
# Exclude files that make network calls on import
addopts = "--ignore=scripts/test_14_crypto_dashboard.py --ignore=test_runner.py --ignore=test_remote.py --ignore=test_schema.py"
