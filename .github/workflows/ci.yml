name: CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polyflip
          POSTGRES_PASSWORD: polyflip
          POSTGRES_DB: polyflip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyflip -d polyflip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://polyflip:polyflip@localhost:5432/polyflip_test
      EXECUTION_MODE: PAPER
      POSTGRES_INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Compile check
        run: poetry run python -m compileall -q polyflip
        # Keep the dashboard module as an explicit startup gate.
      - name: Compile dashboard module
        run: poetry run python -m py_compile polyflip/api/crypto_dashboard.py

      - name: Check dashboard JavaScript
        run: node --check polyflip/static/js/app.js

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Check single alembic head
        run: test "$(poetry run alembic heads | wc -l)" -eq 1

      - name: Validate settings registry keys
        run: poetry run python -c "from polyflip.settings_registry import validate_required_keys; validate_required_keys()"

      - name: Run tests
        run: poetry run pytest tests/ -m "not live" --strict-config --strict-markers -q

      - name: Lint (execution contour)
        run: |
          poetry run flake8 polyflip/execution --max-line-length=100
          poetry run black --check polyflip/execution
