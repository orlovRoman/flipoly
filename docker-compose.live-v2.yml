version: "3.8"

services:
  live_mirror_worker:
    image: ${POLYFLIP_LIVE_IMAGE:?POLYFLIP_LIVE_IMAGE is required}
    restart: unless-stopped
    profiles: ["live-v2"]
    networks:
      - polyflip_net
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - MIRROR_TARGET_MODE=LIVE
      - MIRROR_POLL_INTERVAL=10
    command: python -m polyflip.execution.live_mirror_worker
    deploy:
      resources:
        limits:
          memory: 256M

  release_gate_worker:
    image: ${POLYFLIP_LIVE_IMAGE:?POLYFLIP_LIVE_IMAGE is required}
    restart: unless-stopped
    profiles: ["live-v2"]
    networks:
      - polyflip_net
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
    command: python -m polyflip.execution.release_gate --mode=LIVE
    deploy:
      resources:
        limits:
          memory: 256M

  execution_worker_live:
    image: ${POLYFLIP_LIVE_IMAGE:?POLYFLIP_LIVE_IMAGE is required}
    restart: unless-stopped
    profiles: ["live-v2"]
    networks:
      - polyflip_net
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - EXECUTION_MODE=LIVE
      - POLYGON_PRIVATE_KEY=${POLYGON_PRIVATE_KEY:?POLYGON_PRIVATE_KEY is required in LIVE mode}
      - POLYGON_ADDRESS=${POLYGON_ADDRESS:?POLYGON_ADDRESS is required in LIVE mode}
    command: python -m polyflip.execution.worker
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  polyflip_net:
    external: true
    name: ${POLYFLIP_NETWORK:-polyflip_net}
